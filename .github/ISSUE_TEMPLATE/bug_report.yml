name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `quadit version`.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: How it runs (binary, Docker, Homebrew), the database (SQLite or Postgres), and the browser or agent involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server's log around the time it happened. Remove tokens and addresses you do not want public.
      render: text
