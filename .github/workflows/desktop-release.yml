name: desktop-release

# A tag desktop-v* (desktop-v0.1.0) publishes the desktop app (desktop/):
# each system builds its packages with electron-builder, and the last job
# attaches them to a GitHub Release for the tag. The app's own version
# (desktop/package.json) must be the tag's, and SemVer; a version with a
# pre-release part (1.2.3-beta.1) is published as a GitHub pre-release
# (desktop/scripts/release-tag.mjs reads the tag). A desktop release is
# never the repository's Latest: that is the server's, which install.sh and
# the docs download. Nothing is built for release until the desktop CI
# (desktop-ci.yml, its end-to-end suite among it) passed on the tagged commit.
#
# macOS must be signed and notarized, or the release fails: CSC_LINK (the
# Developer ID Application certificate, a base64 .p12) with
# CSC_KEY_PASSWORD, and for notarization either APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID, or an App Store Connect API
# key: APPLE_API_KEY_P8 (the .p8 file's text), APPLE_API_KEY_ID and
# APPLE_API_ISSUER. MAC_PROVISIONING_PROFILE (base64, a Developer ID profile
# of the app's id) is used when set, and only with it does the app get the
# keychain group of Touch ID passkeys. Only
# a pre-release tag (desktop-v1.2.3-beta.1) may go out unsigned, and only
# with the repository variable DESKTOP_ALLOW_UNSIGNED=true. The build waits
# for Apple's verdict on the signed app for a limited time (15 minutes, or
# the repository variable DESKTOP_NOTARIZE_WAIT; desktop/scripts/notarize.mjs).
# A release fails without the verdict; a pre-release goes out signed and
# unstapled, and macOS stops warning about that same app once Apple accepts
# it (notarization-status.yml shows where a submission stands). A signed app
# is checked before it is published: its signature, that it starts, and for
# a notarized one its stapled ticket and Gatekeeper's verdict. Windows is signed when WIN_CSC_LINK and
# WIN_CSC_KEY_PASSWORD are set, and unsigned otherwise. The Homebrew cask is
# not pushed from here: desktop/packaging/quadit-desktop.rb is its template.
# The macOS and Linux apps carry the quadit command with the web app inside
# (the server "Run Quadit on this computer" runs), built here with pnpm and
# Go (desktop/scripts/cli.mjs) and signed with the app on macOS.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write # the GitHub Release

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag is the app's version, and says whether it is a pre-release
        id: tag
        run: node desktop/scripts/release-tag.mjs "$GITHUB_REF_NAME"

  ci:
    uses: ./.github/workflows/desktop-ci.yml

  build:
    needs: [tag, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64 --arm64
          - os: ubuntu-latest
            target: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        # The whole history and its tags: scripts/cli.mjs stamps the bundled quadit with the last server tag (git describe).
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # web/: cli.mjs builds the web app into the quadit the macOS and Linux apps carry.
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Each system gets its own signing secrets and no other's: given the
      # Apple certificate, the Windows build would try to sign with it.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        id: mac
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          ALLOW_UNSIGNED: ${{ vars.DESKTOP_ALLOW_UNSIGNED }}
          QUADIT_NOTARIZE_WAIT: ${{ vars.DESKTOP_NOTARIZE_WAIT }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          # The App Store Connect API key and the provisioning profile come as
          # secrets; electron-builder reads them from files.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          fi
          if [ -n "$MAC_PROVISIONING_PROFILE" ]; then
            export QUADIT_MAC_PROVISIONING_PROFILE="$RUNNER_TEMP/quadit.provisionprofile"
            printf '%s' "$MAC_PROVISIONING_PROFILE" | base64 --decode > "$QUADIT_MAC_PROVISIONING_PROFILE"
          fi
          # A pre-release does not wait for Apple longer than the limit; a release fails without its verdict.
          if [ "$PRERELEASE" = true ]; then export QUADIT_NOTARIZE_UNANSWERED_OK=true; fi
          # A release is signed and notarized, or it does not go out.
          notarize=no
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then notarize=yes; fi
          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then notarize=yes; fi
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ "$notarize" = yes ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = true ] && [ "$ALLOW_UNSIGNED" = true ]; then
            echo "::warning::The macOS build of the pre-release $GITHUB_REF_NAME is unsigned and not notarized (DESKTOP_ALLOW_UNSIGNED)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::A release's macOS build must be signed and notarized. Set CSC_LINK and CSC_KEY_PASSWORD, and either APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID or APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER. Only a pre-release (desktop-v1.2.3-beta.1) may go out unsigned, with the repository variable DESKTOP_ALLOW_UNSIGNED=true."
            exit 1
          fi
          pnpm build && node scripts/cli.mjs && pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - name: Check the macOS app (link scheme, the quadit command, signature, notarization, Gatekeeper, that it starts)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNED: ${{ steps.mac.outputs.signed }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          for app in dist/mac*/Quadit.app; do
            echo "$app"
            plutil -extract CFBundleURLTypes json -o - "$app/Contents/Info.plist" | grep -q '"quadit"'
            test -x "$app/Contents/Resources/bin/quadit"
            if [ "$SIGNED" = true ]; then
              codesign --verify --deep --strict --verbose=2 "$app"
              if xcrun stapler validate "$app"; then
                spctl --assess --type execute --verbose=4 "$app"
              elif [ "$PRERELEASE" = true ]; then
                echo "$app carries no ticket: Apple had not answered when it was packaged."
              else
                echo "::error::$app is not notarized."
                exit 1
              fi
            fi
          done
          # The app of this machine's own kind; the Intel one would need Rosetta.
          if [ "$SIGNED" = true ]; then sh scripts/mac-app-starts.sh dist/mac-arm64/Quadit.app; fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # No quadit command here: it has no Windows build, and the Windows app has no Connect.
        run: pnpm build && pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: pnpm build && node scripts/cli.mjs && pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      actions: write # starting the website's workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Never Latest, which GitHub would otherwise give the newest release:
      # releases/latest is the server's (install.sh, the docs).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          kind=()
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --latest=false "${kind[@]}" \
            --title "Quadit desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "The Quadit desktop app. macOS: the .dmg for Apple silicon (arm64) or Intel (x64). Windows: the .exe installer. Linux: the AppImage or the .deb."
      # The website's download links are this release's files from now on
      # (pages.yml looks the newest desktop release up as it publishes).
      - name: Publish the website again, with this release's download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
