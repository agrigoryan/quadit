name: desktop-release

# A tag desktop-v* (desktop-v0.1.0) publishes the desktop app (desktop/):
# each system builds its packages with electron-builder, and the last job
# attaches them to a GitHub Release for the tag. The app's own version
# (desktop/package.json) must be the tag's.
#
# macOS is signed and notarized when these secrets are set, and unsigned
# otherwise: CSC_LINK (the Developer ID Application certificate, a base64
# .p12) with CSC_KEY_PASSWORD, and APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
# APPLE_TEAM_ID for notarization. The Homebrew cask is not pushed from here:
# desktop/packaging/quadit-desktop.rb is its template.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write # the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64 --arm64
          - os: ubuntu-latest
            target: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: The tag is the app's version
        shell: bash
        run: test "desktop-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm build && pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY"
          --title "Quadit desktop ${GITHUB_REF_NAME#desktop-v}"
          --notes "The Quadit desktop app. macOS: the .dmg for Apple silicon (arm64) or Intel (x64). Windows: the .exe installer. Linux: the AppImage or the .deb."
