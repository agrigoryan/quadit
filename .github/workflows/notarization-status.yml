name: notarization-status

# Run by hand: what Apple's notary service says about the desktop app's
# submissions (desktop-release.yml sends them). It prints the list of
# submissions with their states, and, given a submission's id, Apple's own
# log for it: the reasons when one is refused. A first submission of a new
# Developer ID can stay "In Progress" for hours, longer than a build waits.
on:
  workflow_dispatch:
    inputs:
      id:
        description: A submission's id, to print Apple's log for it
        required: false
        type: string

permissions: {}

jobs:
  status:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Ask Apple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SUBMISSION: ${{ inputs.id }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          as=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          xcrun notarytool history "${as[@]}"
          if [ -n "$SUBMISSION" ]; then
            xcrun notarytool info "$SUBMISSION" "${as[@]}"
            # Apple has a log only once it has reached a verdict.
            xcrun notarytool log "$SUBMISSION" "${as[@]}" || true
          fi
