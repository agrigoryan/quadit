name: release

# A tag v* publishes a release with GoReleaser (.goreleaser.yaml): the
# archives, packages and checksums on a GitHub Release, the images on
# ghcr.io, and the Homebrew cask when the HOMEBREW_TAP_GITHUB_TOKEN secret is
# set. Nothing is published unless, for the tagged commit itself:
#   on-main  the commit is on main;
#   ci       the whole CI passed (ci.yml: the Go tests with the race detector
#            on SQLite and Postgres, lint, the web app, the end-to-end suite);
#   smoke    the archive, the .deb and the image GoReleaser makes from it
#            start and answer /readyz (scripts/release-smoke.sh).
# The publish job then builds the same commit again with the same tools and
# publishes that: GoReleaser cannot publish a build made in another job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; release only what has been merged"
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The arm64 image is built on this amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Everything the release makes, published nowhere; the images are
      # loaded into the runner's Docker, one per platform.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Start the archive, the .deb and the image
        run: scripts/release-smoke.sh dist

  publish:
    needs: [on-main, ci, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # the images on ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog reads the history since the last tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
