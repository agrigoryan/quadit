name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this on the tagged commit before it
  # publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: quadit
          POSTGRES_DB: quadit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Test on SQLite and Postgres
        env:
          QUADIT_TEST_POSTGRES: postgres://postgres:quadit@127.0.0.1:5432/quadit
          # The runner has Chrome: a picture of a page must be taken here, not skipped.
          QUADIT_TEST_PICTURE: "1"
          # Ubuntu 24.04 keeps Chrome from making its own sandbox ("No usable sandbox!"): the server's
          # setting for a machine like that, as docs/install.md tells its administrator.
          QUADIT_CHROME_ARGS: --no-sandbox
        # The server's tests run every read on both databases under the race detector: longer than go test's ten minutes on a hosted runner.
        run: go test -race -timeout 30m ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # golangci-lint at the version the Makefile names, then the web app's.
      - name: Lint
        run: make lint
      - name: Web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: The whole binary
        run: go build -tags web -o bin/quadit ./cmd/quadit
      # THIRD_PARTY_NOTICES is current, and no dependency is under the GPL,
      # the LGPL or the AGPL (CONTRIBUTING.md, Dependencies).
      - name: Licences
        run: go run ./scripts/notices -check
      # install.sh finds the newest server release among the desktop app's,
      # against a copy of the releases laid out as GitHub serves them.
      - name: The install script
        run: |
          shellcheck install.sh scripts/install-test.sh scripts/agent-listen-check.sh
          sh scripts/install-test.sh

  # The server and the quadit command on Windows, on SQLite (no Postgres
  # service runs there), without the race detector, which needs a C
  # compiler there: the job above runs the same code under it.
  windows:
    runs-on: windows-latest
    steps:
      # The runner's C: drive holds the system and is slow to write; D: is
      # its fast working drive, where the checkout already is. The tests'
      # temporary folders and Go's caches go there too, set before setup-go
      # so that its cache follows. (Defender's real-time scanning is already
      # off on these images, with C:\ and D:\ excluded.)
      - name: Temporary files and Go's caches on the fast drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\tmp, D:\gocache, D:\gomodcache | Out-Null
          "TEMP=D:\tmp", "TMP=D:\tmp", "GOCACHE=D:\gocache", "GOMODCACHE=D:\gomodcache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test on SQLite
        if: ${{ !cancelled() }}
        env:
          # The runner has Chrome and Edge: a picture of a page must be taken here, not skipped.
          QUADIT_TEST_PICTURE: "1"
        run: go test -timeout 30m ./...

  # The end-to-end suite (web/e2e): Chromium against the binary built here.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the binary
        run: make build
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: pnpm e2e
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
