name: desktop-ci

# The desktop app's gate (desktop/): types, lint, format and unit tests, on
# Linux and on Windows (whose release build runs the same check); and
# on a Mac, its end-to-end suite (desktop/test/e2e): the app driven against
# the server built here, signing in through the server's own hand-off, and
# the app packaged as a release packages it (unsigned), checked for what
# only the packaged app has (the quadit:// scheme, its Electron fuses, no
# DevTools port, no Node.js). Locally: make desktop-e2e, with pnpm dist in
# desktop/ first for the packaged checks.
#
# Besides the app, it runs for the server's and the web app's side of the
# desktop contract, for the command-line client the app carries
# (desktop/scripts/cli.mjs) and Connect runs, and for what "Set up on this
# computer" runs of the server: quadit serve's flags (the app key among
# them), the set-up and the sign-in the app makes with that key (an owner
# with no email), the web app's first-run and sign-in pages, and its layout
# in a window without a title bar. The desktop release runs it on the tagged
# commit before it publishes anything.
#
# Every run of the end-to-end suite keeps the pictures of the first run it
# took (test/e2e/onboarding.spec.ts), and of a window without a title bar with
# the numbers macOS gave it (test/e2e/window-frame.spec.ts), as the artifact
# desktop-onboarding-screens.
#
# On Windows the suite's own part for it (test/e2e/windows.spec.ts) runs too:
# set up on this computer, Connect with a stand-in Claude Code, and a run
# Quadit starts with it (internal/fakeagent), its pictures kept as
# desktop-onboarding-screens-windows.
on:
  push:
    branches: [main]
    paths: &paths
      - "desktop/**"
      - ".gitattributes"
      - ".github/workflows/desktop-*.yml"
      - "internal/server/desktop*.go"
      - "internal/server/app_key*.go"
      - "internal/server/auth.go"
      - "internal/server/origin.go"
      - "internal/engine/ch_bootstrap.go"
      - "internal/settings/settings.go"
      - "internal/app/web.go"
      - "internal/cli/**"
      - "internal/fakeagent/**"
      - "internal/app/app.go"
      - "web/src/auth/setup.tsx"
      - "web/src/auth/login.tsx"
      - "web/src/auth/desktop-*"
      - "web/src/shell/system-notices.ts"
      - "web/src/lib/window-inset.ts"
      - "web/src/ui/window-strip.tsx"
      - "web/src/shell/sidebar.tsx"
      - "web/src/shell/topbar.tsx"
      - "web/src/styles/index.css"
      - "web/src/types/desktop.ts"
      - "web/src/insights/agents/agents-page.tsx"
      - "web/public/sw.js"
  pull_request:
    paths: *paths
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        # The whole history and its tags: scripts/cli.mjs stamps the bundled quadit with the last server tag (git describe).
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: The server, with the web app inside
        run: make build
      # cli.mjs builds the web app into the quadit it packages; make build's is the suite's server, which
      # test/e2e/local-server.spec.ts also runs as the app's own (QUADIT_DESKTOP_QUADIT).
      - name: The app, and the app packaged for this Mac, unsigned
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/cli.mjs
          pnpm exec electron-builder --config electron-builder.config.cjs --mac --arm64 --dir --publish never
      # The browser that plays the system browser's part in the sign-in hand-off (test/e2e/sign-in.spec.ts).
      - name: Install Chromium
        working-directory: desktop
        run: pnpm exec playwright install chromium
      - name: End-to-end
        working-directory: desktop
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-onboarding-screens
          path: desktop/onboarding-screens
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results
          path: desktop/test-results
          if-no-files-found: ignore

  # Not failing the run yet, on purpose: nobody has a Windows machine, so CI is the only place the app is seen to work
  # there, and its parts land one at a time (the guard every program the app holds starts under is quadit's own,
  # `quadit guard`, built in internal/cli). Once it passes, continue-on-error goes.
  e2e-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      # What make build makes (no make here), and the stand-in agent program: the command's test binary, which is
      # Claude Code or Codex when FAKEAGENT says which (internal/fakeagent).
      - name: The server, with the web app inside, and the stand-in agent
        shell: bash
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          go build -tags web -o bin/quadit.exe ./cmd/quadit
          go test -c -o bin/fake-claude.exe ./internal/cli
      - name: The app
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: End-to-end, the part for Windows
        working-directory: desktop
        run: pnpm exec playwright test test/e2e/windows.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-onboarding-screens-windows
          path: desktop/onboarding-screens
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results-windows
          path: desktop/test-results
          if-no-files-found: ignore
