name: pages

# The product website (website/) on GitHub Pages, at
# https://agrigoryan.github.io/quadit/. website/shots/ holds the tools that
# make its pictures and is left out of what is published. The download
# links are written in as it is published (scripts/website-downloads.mjs):
# the newest desktop release's files. A desktop release starts this workflow
# when it is out (desktop-release.yml), so the links follow it.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/website-downloads*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages is turned on once the repository is public; until then there is nothing to deploy to.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: The site without its picture-making tools
        run: |
          mkdir _site
          rsync -a --exclude shots/ website/ _site/
      - name: The download links of the newest desktop release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/website-downloads.test.mjs
          node scripts/website-downloads.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
