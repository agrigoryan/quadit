<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quadit sharing picture</title>
<!-- The 1200×630 picture link previews show; preview.ts renders it to website/og.png. -->
<style>
  @font-face { font-family: "Newsreader"; src: url(../fonts/newsreader-latin-opsz-normal.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Plex Mono"; src: url(../fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6f4ef; color: #1a2130; font-family: "Newsreader", Georgia, serif; position: relative; }
  .brand { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 600; }
  .brand svg { width: 44px; height: 44px; }
  h1 { position: absolute; left: 72px; top: 150px; width: 620px; margin: 0; font-size: 84px; line-height: 0.98; font-weight: 400; letter-spacing: -0.025em; }
  .line { position: absolute; left: 72px; bottom: 60px; font: 19px "Plex Mono", monospace; color: #474e5d; border-top: 1px solid #d5cfc2; padding-top: 16px; width: 1056px; }
  .opts { position: absolute; right: 72px; top: 92px; display: grid; grid-template-columns: repeat(2, 190px); gap: 18px; }
  .opt { background: #ececec; border: 1px solid #1a2130; border-radius: 16px; overflow: hidden; }
  .opt img { width: 100%; display: block; }
  .opt b { display: block; background: #fcfbf8; font-size: 22px; padding: 8px 14px; font-weight: 600; }
  .opt.chosen { box-shadow: 0 0 0 5px #ffd60a; }
  .opt.chosen b { background: #ffd60a; }
  .opt.dim { opacity: 0.45; }
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="#1a2130"/><g fill="none" stroke="#f6f4ef" stroke-width="26" opacity=".6"><rect x="118" y="118" width="122" height="122" rx="30"/><rect x="118" y="272" width="122" height="122" rx="30"/><rect x="272" y="272" width="122" height="122" rx="30"/></g><rect x="259" y="105" width="148" height="148" rx="36" fill="#ffd60a"/></svg>Quadit</div>
  <h1>Your agents do the work. You make the calls.</h1>
  <div class="opts">
    <div class="opt dim"><img src="../img/icon-wave.png" alt=""><b>Wave</b></div>
    <div class="opt chosen"><img src="../img/icon-tideclock.png" alt=""><b>Tide clock</b></div>
  </div>
  <p class="line">Tasks, docs and decisions for people and AI agents. Self-hosted, one Go binary, MIT.</p>
</body>
</html>
