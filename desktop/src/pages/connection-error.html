<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"
    />
    <title>Cannot be reached</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main class="connection-error">
      <img src="icon.png" alt="" width="48" height="48" />
      <h1 id="title"></h1>
      <p id="origin" class="origin"></p>
      <p id="reason"></p>
      <p class="hint">The app tries again on its own.</p>
      <button id="retry" type="button" class="primary">Try again</button>
    </main>
    <script src="connection-error.js"></script>
  </body>
</html>
