# A bigger install: Postgres for the database, and S3-compatible storage
# (RustFS here) for files. File storage is set in the admin area, or with
# QUADIT_SETTING_FILES as below. Any S3-compatible store works the same way:
# AWS S3, Cloudflare R2, or one of your own.
#
#   docker compose -f deploy/docker-compose.postgres.yml up -d

services:
  quadit:
    image: ghcr.io/agrigoryan/quadit:latest
    # Or build it from this checkout: replace the line above with build: ..
    restart: unless-stopped
    # Quadit starts once the database answers and the bucket is made. It
    # never stores files on its own disk instead: until the bucket can be
    # used, /readyz (and so the container's health) says it is not ready.
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
    ports:
      - "4780:4780"
    environment:
      QUADIT_BASE_URL: http://localhost:4780
      QUADIT_DB: postgres://quadit:change-me@postgres:5432/quadit?sslmode=disable
      # Keep this the same across restarts and copies: it encrypts stored secrets.
      QUADIT_SECRET: change-me-to-a-long-random-string
      QUADIT_SETTING_FILES: >-
        {"kind":"s3","bucket":"quadit","endpoint":"http://s3:9000","access_key":"quadit","secret_key":"change-me-too","region":"us-east-1"}
    volumes:
      - quadit-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quadit
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: quadit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadit"]
      interval: 5s
      retries: 10

  s3:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: quadit
      RUSTFS_SECRET_KEY: change-me-too
    volumes:
      - s3-data:/data

  # Makes the bucket once, waiting for the store to answer, then exits.
  bucket:
    image: amazon/aws-cli:2.41.0
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: quadit
      AWS_SECRET_ACCESS_KEY: change-me-too
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for try in $$(seq 60); do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket quadit 2>/dev/null && exit 0
          aws --endpoint-url http://s3:9000 s3 mb s3://quadit && exit 0
          sleep 2
        done
        echo "the bucket could not be made" >&2
        exit 1

volumes:
  quadit-data:
  postgres-data:
  s3-data:
