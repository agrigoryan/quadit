# The default install: one container, one SQLite file, files on disk.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://localhost:4780

services:
  quadit:
    build: ..
    image: quadit
    restart: unless-stopped
    ports:
      - "4780:4780"
    environment:
      # The address people use to reach it. Passkeys and links in mail need it.
      QUADIT_BASE_URL: http://localhost:4780
    volumes:
      - quadit-data:/data

volumes:
  quadit-data:
